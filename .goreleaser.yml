# This is an example .goreleaser.yml file with some sensible defaults.
# Make sure to check the documentation at https://goreleaser.com
version: 2

builds:
  # Version lives in the command package; the link symbol must be the full
  # import path (main.Version silently stamps nothing since Version moved to
  # the command package).
  - ldflags: -s -w -X "corrupt952/closest/command.Version={{.Version}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

# Packging only binary
# FYI: https://goreleaser.com/customization/archive/#packaging-only-the-binaries
archives:
  - files:
      - none*
